<div class="container mt-4">
  <h3>Your Cart</h3>

  <div *ngIf="!items.length" class="alert alert-info mt-3">
    Your cart is empty.
  </div>

  <table *ngIf="items.length" class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.name }}</td>
        <td>₹{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>₹{{ item.price * item.quantity }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="remove(item.id)">
            Remove
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="items.length" class="mt-3 text-end">
    <h5>Total: ₹{{ total }}</h5>
    <button class="btn btn-success mt-2" (click)="clear()">Checkout</button>
  </div>
</div>
