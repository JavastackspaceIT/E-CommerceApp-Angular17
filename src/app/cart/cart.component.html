<!-- cart.component.html -->
<div class="container mt-4">
  <h3>Your Cart</h3>
  <div *ngIf="cartItems.length === 0">Your cart is empty.</div>

  <div *ngFor="let item of cartItems" class="card my-2 p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5>{{ item.name }}</h5>
        <p>Quantity: {{ item.quantity }}</p>
      </div>
      <button class="btn btn-danger" (click)="removeItem(item.id)">
        Remove
      </button>
    </div>
  </div>
</div>
