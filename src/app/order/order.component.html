<div class="container mt-4">
  <h3 class="mb-4 text-center">My Orders</h3>

  <div *ngIf="orders.length > 0; else noOrders">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Items</th>
          <th>Total (₹)</th>
          <th>Status</th>
          <th>Payment</th>
          <th>Delivery Address</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.id }}</td>
          <td>{{ order.date | date: 'mediumDate' }}</td>
          <td>
            <ul class="mb-0">
              <li *ngFor="let item of order.items">{{ item }}</li>
            </ul>
          </td>
          <td>{{ order.total | currency:'INR' }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-warning text-dark': order.status === 'Pending',
                'bg-info text-dark': order.status === 'Shipped',
                'bg-success': order.status === 'Delivered',
                'bg-danger': order.status === 'Cancelled'
              }"
            >
              {{ order.status }}
            </span>
          </td>
          <td>{{ order.paymentMethod }}</td>
          <td>{{ order.address }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noOrders>
    <div class="alert alert-info text-center">You have no orders yet.</div>
  </ng-template>
</div>
